sensors:
  - camera_pointcloud
  # - camera_depth_image
camera_pointcloud:
    sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
    point_cloud_topic: /skill_execution_state_interface/points_dummy
    max_range: 5.0
    point_subsample: 1
    padding_offset: 0.1
    padding_scale: 1.5
    max_update_rate: 1.0
    filtered_cloud_topic: /camera/filtered_points
